<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adelowo's Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased pb-24">

    <!-- Top Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10 flex justify-between items-center shadow-md">
        <h1 class="text-base font-extrabold tracking-wider text-emerald-400">ADELOWO'S LEDGER</h1>
        <div class="flex items-center gap-2">
            <a href="budget.html" class="bg-emerald-950 hover:bg-emerald-900 text-emerald-300 text-xs px-3 py-1.5 rounded-lg border border-emerald-800 font-medium transition-colors">Budget Setup</a>
            <span id="current-date" class="text-xs text-slate-400 font-medium"></span>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-5">

        <!-- Weekly Financial Health Dashboard -->
        <section class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Weekly Financial Health (Tue - Mon)</h2>
                <span id="health-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide">Calculating...</span>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center pt-1">
                <div class="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700/60">
                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Inflow</p>
                    <p id="health-inflow" class="text-xs font-bold text-emerald-400 mt-1">₦0</p>
                </div>
                <div class="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700/60">
                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Outflow</p>
                    <p id="health-outflow" class="text-xs font-bold text-rose-400 mt-1">₦0</p>
                </div>
                <div class="bg-slate-800/80 p-2.5 rounded-xl border border-slate-700/60">
                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Net Position</p>
                    <p id="health-net" class="text-xs font-bold text-blue-400 mt-1">₦0</p>
                </div>
            </div>
        </section>

        <!-- Summary Cards -->
        <section class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-lg">
                <p class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Total Income</p>
                <p id="total-income" class="text-lg font-bold text-emerald-400 mt-1">₦0</p>
            </div>
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-lg">
                <p class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Total Expenses</p>
                <p id="total-expense" class="text-lg font-bold text-rose-400 mt-1">₦0</p>
            </div>
        </section>

        <!-- Quick Entry Form -->
        <section class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-lg space-y-3">
            <h2 id="form-title" class="text-xs font-bold text-slate-300 uppercase tracking-wider">Log Transaction</h2>
            <form id="transaction-form" class="space-y-3">
                <input type="hidden" id="edit-id" value="">
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[11px] text-slate-400 font-medium">Executor</label>
                        <select id="executor" required class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="">Select Executor</option>
                            <option value="Adel">Adel</option>
                            <option value="Chinyere">Chinyere</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[11px] text-slate-400 font-medium">Type</label>
                        <select id="type" required onchange="toggleFormMode()" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[11px] text-slate-400 font-medium">Amount (₦)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" required placeholder="1.00" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 placeholder-slate-500">
                    </div>
                    <div id="channel-container">
                        <label class="text-[11px] text-slate-400 font-medium">Category Channel</label>
                        <select id="tracking_type" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="Personal">Fixed Personal</option>
                            <option value="Shop">Fixed Shop Based</option>
                            <option value="Random">Random Expense</option>
                            <option value="Savings">Savings</option>
                        </select>
                    </div>
                </div>

                <!-- Dynamic Expense Panels -->
                <div id="expense-panels-wrapper">
                    <div id="personal-sub-panel" class="space-y-2 bg-slate-800/60 p-3 rounded-xl border border-slate-700">
                        <label class="text-[11px] text-slate-400 font-medium">Personal Expense Category</label>
                        <select id="personal_sub" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-sm text-slate-100">
                            <option value="Food">Food</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Utility">Utility</option>
                            <option value="Fueling and Transportation">Fueling and Transportation</option>
                        </select>
                    </div>

                    <div id="shop-sub-panel" class="space-y-2 bg-slate-800/60 p-3 rounded-xl border border-slate-700 hidden">
                        <div>
                            <label class="text-[11px] text-slate-400 font-medium">Select Shop Location</label>
                            <select id="shop_location" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-sm text-slate-100 mb-2">
                                <option value="Elewi Odo">Elewi Odo</option>
                                <option value="10/10">10/10</option>
                                <option value="Idi Ape">Idi Ape</option>
                                <option value="Gbaremu">Gbaremu</option>
                                <option value="Oluyole">Oluyole</option>
                                <option value="Gbagi Shop">Gbagi Shop</option>
                                <option value="Bodija Oju Irin">Bodija Oju Irin</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-400 font-medium">Shop Expense Type</label>
                            <select id="shop_sub" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-sm text-slate-100">
                                <option value="Paper">Paper</option>
                                <option value="Data">Data</option>
                                <option value="Salary">Salary</option>
                                <option value="Utility">Utility</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Dynamic Income Panel -->
                <div id="income-panel" class="space-y-3 bg-slate-800/60 p-3 rounded-xl border border-slate-700 hidden">
                    <div>
                        <label class="text-[11px] text-slate-400 font-medium">Income Category</label>
                        <select id="income_category" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl p-2 text-sm text-slate-100">
                            <option value="Service">Service</option>
                            <option value="Sales">Sales</option>
                            <option value="Commission">Commission</option>
                            <option value="Gift">Gift</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-[11px] text-slate-400 font-medium">Description / Note <span id="note-asterisk" class="text-rose-400">*</span></label>
                    <input type="text" id="note" required placeholder="Detailed description required..." class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 placeholder-slate-500">
                </div>

                <div class="flex gap-2 pt-1">
                    <button type="submit" id="submit-btn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl text-sm transition-colors shadow-lg shadow-emerald-900/40">
                        Save to Cloud Ledger
                    </button>
                    <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-xl text-sm transition-colors font-medium border border-slate-700">
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <!-- Historical Reports & PDF Download -->
        <section class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-lg space-y-3">
            <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Historical Statements & PDF</h2>
            
            <div>
                <label class="text-[10px] text-slate-400 font-medium">Report Scope / Executor Filter</label>
                <select id="report-scope" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                    <option value="general">1. General Report (All Executors)</option>
                    <option value="Adel">2. Executor Adel</option>
                    <option value="Chinyere">3. Executor Chinyere</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-slate-400 font-medium">Start Date</label>
                    <input type="date" id="report-start-date" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-slate-100">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 font-medium">End Date</label>
                    <input type="date" id="report-end-date" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-slate-100">
                </div>
            </div>
            
            <div id="report-output" class="text-xs text-slate-300 bg-slate-800/60 p-3 rounded-xl border border-slate-700 space-y-1.5 font-medium">
                <!-- Metrics injected -->
            </div>

            <button id="download-pdf-btn" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-semibold py-2.5 rounded-xl text-xs transition-colors flex items-center justify-center gap-1 shadow-lg shadow-emerald-900/40">
                Download Colorful PDF Statement
            </button>
        </section>

        <!-- Recent Logs -->
        <section class="space-y-2.5">
            <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Recent History</h2>
            <div id="transaction-list" class="space-y-2">
                <p class="text-xs text-slate-500 text-center py-4">Loading transactions...</p>
            </div>
        </section>

    </main>

    <script>
        const SUPABASE_URL = 'https://itbnekbbezzbpsgsidet.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3PF-xkCW382a9XOpZWsHYg_rcktU95h';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allTransactions = [];
        
        const now = new Date();
        const firstDayOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
        const todayStr = now.toISOString().split('T')[0];
        
        document.getElementById('report-start-date').value = firstDayOfMonth;
        document.getElementById('report-end-date').value = todayStr;
        document.getElementById('current-date').innerText = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

        const typeSelect = document.getElementById('type');
        const trackingTypeSelect = document.getElementById('tracking_type');
        const personalPanel = document.getElementById('personal-sub-panel');
        const shopPanel = document.getElementById('shop-sub-panel');
        const incomePanel = document.getElementById('income-panel');

        function toggleFormMode() {
            const type = typeSelect.value;
            if (type === 'income') {
                personalPanel.classList.add('hidden');
                shopPanel.classList.add('hidden');
                incomePanel.classList.remove('hidden');
                trackingTypeSelect.parentElement.classList.add('hidden');
            } else {
                incomePanel.classList.add('hidden');
                trackingTypeSelect.parentElement.classList.remove('hidden');
                const val = trackingTypeSelect.value;
                personalPanel.classList.toggle('hidden', val !== 'Personal');
                shopPanel.classList.toggle('hidden', val !== 'Shop');
            }
        }

        typeSelect.addEventListener('change', toggleFormMode);

        trackingTypeSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            personalPanel.classList.add('hidden');
            shopPanel.classList.add('hidden');
            if (val === 'Personal') personalPanel.classList.remove('hidden');
            if (val === 'Shop') shopPanel.classList.remove('hidden');
        });

        async function fetchTransactions() {
            const { data, error } = await _supabase
                .from('transactions')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching data:', error);
                return;
            }
            allTransactions = data || [];
            updateUI();
        }

        const form = document.getElementById('transaction-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const editId = document.getElementById('edit-id').value;
            btn.innerText = 'Saving...';
            btn.disabled = true;

            const type = typeSelect.value;
            const trackingType = type === 'income' ? 'Income' : trackingTypeSelect.value;
            let subCat = '';
            let shopLoc = null;

            if (type === 'income') {
                subCat = document.getElementById('income_category').value;
            } else if (trackingType === 'Personal') {
                subCat = document.getElementById('personal_sub').value;
            } else if (trackingType === 'Shop') {
                subCat = document.getElementById('shop_sub').value;
                shopLoc = document.getElementById('shop_location').value;
            } else {
                subCat = trackingType;
            }

            const txData = {
                executor: document.getElementById('executor').value,
                type: type,
                amount: parseFloat(document.getElementById('amount').value),
                tracking_type: trackingType,
                shop: shopLoc,
                sub_category: subCat,
                note: document.getElementById('note').value
            };

            let error;
            if (editId) {
                const res = await _supabase.from('transactions').update(txData).eq('id', editId);
                error = res.error;
            } else {
                const res = await _supabase.from('transactions').insert([txData]);
                error = res.error;
            }

            if (error) {
                alert('Error saving transaction: ' + error.message);
            } else {
                resetForm();
                await fetchTransactions();
            }

            btn.innerText = 'Save to Cloud Ledger';
            btn.disabled = false;
        });

        function resetForm() {
            form.reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').innerText = 'Log Transaction';
            document.getElementById('submit-btn').innerText = 'Save to Cloud Ledger';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            typeSelect.value = 'expense';
            trackingTypeSelect.value = 'Personal';
            toggleFormMode();
        }

        function editTransaction(id) {
            const tx = allTransactions.find(t => t.id == id);
            if (!tx) return;

            document.getElementById('edit-id').value = tx.id;
            document.getElementById('executor').value = tx.executor || '';
            typeSelect.value = tx.type || 'expense';
            document.getElementById('amount').value = tx.amount;
            
            toggleFormMode();

            if (tx.type === 'income') {
                document.getElementById('income_category').value = tx.sub_category || 'Service';
            } else {
                trackingTypeSelect.value = tx.tracking_type || 'Personal';
                trackingTypeSelect.dispatchEvent(new Event('change'));
                if (tx.tracking_type === 'Personal') {
                    document.getElementById('personal_sub').value = tx.sub_category || 'Food';
                } else if (tx.tracking_type === 'Shop') {
                    document.getElementById('shop_location').value = tx.shop || 'Elewi Odo';
                    document.getElementById('shop_sub').value = tx.sub_category || 'Paper';
                }
            }
            document.getElementById('note').value = tx.note || '';

            document.getElementById('form-title').innerText = 'Edit Transaction #' + tx.id;
            document.getElementById('submit-btn').innerText = 'Update Transaction';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteTransaction(id) {
            if (!confirm('Are you sure you want to delete this record?')) return;
            const { error } = await _supabase.from('transactions').delete().eq('id', id);
            if (error) {
                alert('Error deleting record: ' + error.message);
            } else {
                await fetchTransactions();
            }
        }

        document.getElementById('report-start-date').addEventListener('change', renderReports);
        document.getElementById('report-end-date').addEventListener('change', renderReports);
        document.getElementById('report-scope').addEventListener('change', renderReports);

        function formatCurrency(amount) {
            return '₦' + Number(amount).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function getTuesdayToMondayRange(dateObj) {
            const d = new Date(dateObj);
            const day = d.getDay(); 
            let diff = d.getDate() - day + (day === 0 ? -5 : 2);
            if (day < 2) diff -= 7;
            
            const startTuesday = new Date(d.setDate(diff));
            startTuesday.setHours(0, 0, 0, 0);

            const endMonday = new Date(startTuesday);
            endMonday.setDate(startTuesday.getDate() + 6);
            endMonday.setHours(23, 59, 59, 999);

            return { startTuesday, endMonday };
        }

        function getFilteredTransactions() {
            const startStr = document.getElementById('report-start-date').value;
            const endStr = document.getElementById('report-end-date').value;
            const scope = document.getElementById('report-scope').value;
            
            const startDate = startStr ? new Date(startStr) : new Date(0);
            const endDate = endStr ? new Date(endStr) : new Date();
            
            startDate.setHours(0, 0, 0, 0);
            endDate.setHours(23, 59, 59, 999);

            return allTransactions.filter(t => {
                const tDate = new Date(t.created_at);
                const matchesDate = tDate >= startDate && tDate <= endDate;
                const matchesScope = (scope === 'general' || t.executor === scope);
                return matchesDate && matchesScope;
            });
        }

        function updateUI() {
            let totalInc = allTransactions.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount), 0);
            let totalExp = allTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0);

            document.getElementById('total-income').innerText = formatCurrency(totalInc);
            document.getElementById('total-expense').innerText = formatCurrency(totalExp);

            const { startTuesday, endMonday } = getTuesdayToMondayRange(new Date());
            const weeklyTx = allTransactions.filter(t => {
                const d = new Date(t.created_at);
                return d >= startTuesday && d <= endMonday;
            });

            let wInc = weeklyTx.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
            let wExp = weeklyTx.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
            let wNet = wInc - wExp;

            document.getElementById('health-inflow').innerText = formatCurrency(wInc);
            document.getElementById('health-outflow').innerText = formatCurrency(wExp);
            const netEl = document.getElementById('health-net');
            netEl.innerText = formatCurrency(wNet);
            netEl.className = `text-xs font-bold mt-1 ${wNet >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

            const badge = document.getElementById('health-badge');
            if (wNet > 0) {
                badge.innerText = 'Sufficit (Surplus)';
                badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide bg-emerald-950 text-emerald-300 border border-emerald-800';
            } else if (wNet < 0) {
                badge.innerText = 'Deficit';
                badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide bg-rose-950 text-rose-300 border border-rose-800';
            } else {
                badge.innerText = 'Balanced';
                badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide bg-blue-950 text-blue-300 border border-blue-800';
            }

            const listEl = document.getElementById('transaction-list');
            listEl.innerHTML = '';

            if (allTransactions.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No transactions recorded yet.</p>`;
            } else {
                allTransactions.slice(0, 15).forEach(t => {
                    const item = document.createElement('div');
                    item.className = "bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs shadow-sm";
                    const tDate = new Date(t.created_at);
                    let badgeText = t.shop ? `${t.shop} - ${t.sub_category}` : t.sub_category;
                    item.innerHTML = `
                        <div class="pr-2 space-y-0.5">
                            <p class="font-medium text-slate-200">${t.note} <span class="text-[10px] text-emerald-300 bg-emerald-950 border border-emerald-800 px-1.5 py-0.5 rounded ml-1">${badgeText}</span></p>
                            <p class="text-slate-500">Executor: <span class="text-slate-300 font-semibold">${t.executor}</span> | ${tDate.toLocaleDateString()}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold whitespace-nowrap ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">
                                ${t.type === 'income' ? '+' : '-'}${formatCurrency(t.amount)}
                            </span>
                            <div class="flex flex-col gap-0.5">
                                <button onclick="editTransaction(${t.id})" class="text-[10px] text-emerald-400 font-medium hover:underline">Edit</button>
                                <button onclick="deleteTransaction(${t.id})" class="text-[10px] text-rose-400 font-medium hover:underline">Del</button>
                            </div>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            }
            renderReports();
        }

        function renderReports() {
            const filtered = getFilteredTransactions();
            let inc = filtered.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
            let exp = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
            let net = inc - exp;

            document.getElementById('report-output').innerHTML = `
                <div class="flex justify-between"><span>Inflow:</span> <span class="text-emerald-400 font-semibold">${formatCurrency(inc)}</span></div>
                <div class="flex justify-between"><span>Outflow:</span> <span class="text-rose-400 font-semibold">${formatCurrency(exp)}</span></div>
                <div class="flex justify-between border-t border-slate-700 pt-1.5 mt-1 font-bold text-slate-100"><span>Net Balance:</span> <span class="${net >= 0 ? 'text-blue-400' : 'text-amber-400'}">${formatCurrency(net)}</span></div>
            `;
        }

        document.getElementById('download-pdf-btn').addEventListener('click', () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const filtered = getFilteredTransactions();
            
            const startStr = document.getElementById('report-start-date').value;
            const endStr = document.getElementById('report-end-date').value;
            const scope = document.getElementById('report-scope').value;
            
            const scopeTitle = scope === 'general' ? 'GENERAL FINANCIAL STATEMENT' : `EXECUTOR STATEMENT: ${scope.toUpperCase()}`;
            const subtitle = `${scopeTitle} (${startStr} to ${endStr})`;

            doc.setFillColor(16, 185, 129);
            doc.rect(0, 0, 210, 40, 'F');

            doc.setTextColor(255, 255, 255);
            doc.setFontSize(18);
            doc.setFont('helvetica', 'bold');
            doc.text("ADELOWO'S LEDGER", 14, 20);

            doc.setFontSize(9);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(236, 253, 245);
            doc.text(subtitle, 14, 28);
            doc.text(`Generated: ${new Date().toLocaleString()}`, 130, 28);

            let totalInc = filtered.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
            let totalExp = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
            let netBalance = totalInc - totalExp;

            doc.setFillColor(241, 245, 249);
            doc.roundedRect(14, 48, 182, 22, 3, 3, 'F');

            doc.setFontSize(9);
            doc.setTextColor(71, 85, 105);
            doc.text("TOTAL INFLOW", 20, 56);
            doc.text("TOTAL OUTFLOW", 85, 56);
            doc.text("NET BALANCE", 150, 56);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.setTextColor(16, 185, 129);
            doc.text(formatCurrency(totalInc), 20, 64);
            doc.setTextColor(225, 29, 72);
            doc.text(formatCurrency(totalExp), 85, 64);
            doc.setTextColor(37, 99, 235);
            doc.text(formatCurrency(netBalance), 150, 64);

            let y = 80;
            doc.setFillColor(30, 41, 59);
            doc.rect(14, y, 182, 8, 'F');
            
            doc.setFontSize(8);
            doc.setTextColor(255, 255, 255);
            doc.text("Date", 18, y + 5.5);
            doc.text("Executor", 45, y + 5.5);
            doc.text("Category / Shop", 75, y + 5.5);
            doc.text("Note / Details", 115, y + 5.5);
            doc.text("Amount (₦)", 170, y + 5.5);

            y += 8;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);

            if (filtered.length === 0) {
                doc.setTextColor(100, 100, 100);
                doc.text("No transactions found for this period and scope.", 14, y + 10);
            } else {
                filtered.forEach((t, index) => {
                    if (y > 270) {
                        doc.addPage();
                        y = 20;
                    }

                    if (index % 2 === 0) {
                        doc.setFillColor(248, 250, 252);
                        doc.rect(14, y, 182, 7, 'F');
                    }

                    const dateStr = new Date(t.created_at).toLocaleDateString();
                    const catStr = t.shop ? `${t.shop}` : (t.sub_category || '-');

                    doc.setTextColor(30, 41, 59);
                    doc.text(dateStr, 18, y + 4.5);
                    doc.text(t.executor || '-', 45, y + 4.5);
                    doc.text(catStr, 75, y + 4.5);
                    doc.text((t.note || '').substring(0, 30), 115, y + 4.5);

                    const formattedAmt = Number(t.amount).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    if (t.type === 'income') {
                        doc.setTextColor(16, 185, 129);
                        doc.text(`+${formattedAmt}`, 170, y + 4.5);
                    } else {
                        doc.setTextColor(225, 29, 72);
                        doc.text(`-${formattedAmt}`, 170, y + 4.5);
                    }

                    y += 7;
                });
            }

            doc.setFontSize(8);
            doc.setTextColor(150, 150, 150);
            doc.text("Adelowo's Financial Management System — Powered by Supabase", 14, 290);

            doc.save(`Adelowo_Statement_${scope}_${startStr}_to_${endStr}.pdf`);
        });

        fetchTransactions();
    </script>
</body>
</html>
