<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adelowo Akíngbàṣẹ Ledger - Access</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ledgerPrimary: '#1e293b',
                        ledgerAccent: '#3b82f6',
                        ledgerCard: '#0f172a',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center">

    <!-- ================= WELCOME / PASSWORD GATEWAY ================= -->
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 text-center relative overflow-hidden mx-4">
        
        <!-- Decorative top banner element -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-cyan-400"></div>

        <div class="mb-6 mt-2">
            <span class="inline-block p-3 rounded-full bg-blue-500/10 text-blue-400 mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </span>
            <h1 class="text-2xl font-bold tracking-tight text-white">Adelowo Akíngbàṣẹ Ledger</h1>
            <p class="text-sm text-slate-400 mt-1">Secure Financial & Record Management System</p>
        </div>

        <!-- Initial Action Button -->
        <div id="actionContainer">
            <button onclick="showPasswordPrompt()" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl shadow-lg shadow-blue-600/20 transition-all duration-200 transform active:scale-95">
                Access Ledger
            </button>
        </div>

        <!-- Password Input Hidden Form (Revealed on Button Click) -->
        <div id="passwordContainer" class="hidden space-y-4 text-left">
            <div>
                <label for="ledgerPassword" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Enter Password</label>
                <input type="password" id="ledgerPassword" placeholder="Enter ledger password" 
                    class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                    onkeypress="handleKeyPress(event)">
            </div>
            
            <p id="errorMessage" class="text-xs text-red-400 hidden font-medium">Incorrect password. Please try again.</p>

            <div class="flex space-x-3 pt-2">
                <button onclick="verifyPassword()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl shadow-md transition-all">
                    Confirm
                </button>
                <button onclick="cancelPassword()" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl transition-all">
                    Back
                </button>
            </div>
        </div>

        <div class="mt-8 text-xs text-slate-500 border-t border-slate-800/80 pt-4">
            Authorized access only. Protected session.
        </div>
    </div>

    <!-- ================= LOGIC SCRIPT ================= -->
    <script>
        const CORRECT_PASSWORD = "Krinox1803";

        // Optional: If already unlocked in this session, redirect straight to dashboard
        window.addEventListener('DOMContentLoaded', () => {
            const isUnlocked = sessionStorage.getItem('ledger_unlocked');
            if (isUnlocked === 'true') {
                window.location.href = "dashboard.html";
            }
        });

        function showPasswordPrompt() {
            document.getElementById('actionContainer').classList.add('hidden');
            document.getElementById('passwordContainer').classList.remove('hidden');
            document.getElementById('ledgerPassword').focus();
        }

        function cancelPassword() {
            document.getElementById('passwordContainer').classList.add('hidden');
            document.getElementById('actionContainer').classList.remove('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('ledgerPassword').value = '';
        }

        function verifyPassword() {
            const inputVal = document.getElementById('ledgerPassword').value;
            const errorMsg = document.getElementById('errorMessage');

            if (inputVal === CORRECT_PASSWORD) {
                sessionStorage.setItem('ledger_unlocked', 'true');
                errorMsg.classList.add('hidden');
                // Redirect to the dashboard page
                window.location.href = "dashboard.html";
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('ledgerPassword').focus();
                document.getElementById('ledgerPassword').select();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                verifyPassword();
            }
        }
    </script>
</body>
</html>
