<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adelowo Akíngbàṣẹ Ledger - Access</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ledgerDark: '#064e3b',
                        ledgerLemon: '#84cc16',
                        ledgerGreenAccent: '#22c55e',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-end relative overflow-hidden">

    <!-- ================= FULL SCREEN BACKGROUND IMAGE WITH GRADIENT OVERLAY ================= -->
    <div class="absolute inset-0 z-0">
        <!-- Background image referenced as hero-bg1.jpeg -->
        <img src="hero-bg1.jpeg" alt="Background" class="w-full h-full object-cover object-center" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&q=80'">
        
        <!-- Deep green and dark gradient overlay to ensure text legibility -->
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/80 to-emerald-950/40"></div>
    </div>

    <!-- ================= CONTENT CONTAINER (BOTTOM ALIGNED) ================= -->
    <div class="relative z-10 max-w-md w-full mx-auto p-6 sm:p-8 flex flex-col justify-end min-h-screen">
        
        <div class="mb-auto pt-10 text-center">
            <!-- Optional indicator dots styling mimicking mobile onboarding templates -->
            <div class="flex justify-center space-x-1.5 mb-6">
                <span class="w-6 h-1.5 bg-lime-400 rounded-full"></span>
                <span class="w-1.5 h-1.5 bg-slate-600 rounded-full"></span>
                <span class="w-1.5 h-1.5 bg-slate-600 rounded-full"></span>
            </div>
        </div>

        <div class="space-y-6">
            <div class="text-left">
                <div class="inline-flex items-center justify-center p-2.5 rounded-xl bg-lime-500/10 text-lime-400 mb-3 border border-lime-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-white">Adelowo Akíngbàṣẹ Ledger</h1>
                <p class="text-sm text-slate-300 mt-1.5 leading-relaxed">Secure Financial & Record Management System. Enter to manage your records seamlessly.</p>
            </div>

            <!-- Initial Action Button -->
            <div id="actionContainer">
                <button onclick="showPasswordPrompt()" class="w-full py-3.5 px-4 bg-lime-500 hover:bg-lime-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-lime-500/20 transition-all duration-200 transform active:scale-95">
                    Access Ledger
                </button>
            </div>

            <!-- Password Input Hidden Form (Revealed on Button Click) -->
            <div id="passwordContainer" class="hidden space-y-4 text-left bg-slate-900/90 backdrop-blur-md p-5 rounded-2xl border border-slate-800 shadow-2xl">
                <div>
                    <label for="ledgerPassword" class="block text-xs font-semibold uppercase tracking-wider text-lime-400 mb-1.5">Enter Password</label>
                    <input type="password" id="ledgerPassword" placeholder="Enter ledger password" 
                        class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-lime-500 focus:ring-1 focus:ring-lime-500 transition-all text-sm"
                        onkeypress="handleKeyPress(event)">
                </div>
                
                <p id="errorMessage" class="text-xs text-red-400 hidden font-medium">Incorrect password. Please try again.</p>

                <div class="flex space-x-3 pt-1">
                    <button onclick="verifyPassword()" class="flex-1 py-3 bg-lime-500 hover:bg-lime-400 text-slate-950 font-bold rounded-xl shadow-md transition-all text-sm">
                        Confirm
                    </button>
                    <button onclick="cancelPassword()" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl transition-all text-sm">
                        Back
                    </button>
                </div>
            </div>

            <div class="text-center pb-4 pt-2">
                <span class="text-xs text-slate-400 tracking-wide">Authorized access only. Protected session.</span>
            </div>
        </div>
    </div>

    <!-- ================= LOGIC SCRIPT ================= -->
    <script>
        const CORRECT_PASSWORD = "Krinox1803";

        // Clear any previous unlock state on load so refreshing index always starts fresh
        window.addEventListener('DOMContentLoaded', () => {
            sessionStorage.removeItem('ledger_unlocked');
        });

        function showPasswordPrompt() {
            document.getElementById('actionContainer').classList.add('hidden');
            document.getElementById('passwordContainer').classList.remove('hidden');
            document.getElementById('ledgerPassword').focus();
        }

        function cancelPassword() {
            document.getElementById('passwordContainer').classList.add('hidden');
            document.getElementById('actionContainer').classList.remove('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('ledgerPassword').value = '';
        }

        function verifyPassword() {
            const inputVal = document.getElementById('ledgerPassword').value;
            const errorMsg = document.getElementById('errorMessage');

            if (inputVal === CORRECT_PASSWORD) {
                sessionStorage.setItem('ledger_unlocked', 'true');
                errorMsg.classList.add('hidden');
                // Redirect to the dashboard page
                window.location.href = "dashboard.html";
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('ledgerPassword').focus();
                document.getElementById('ledgerPassword').select();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                verifyPassword();
            }
        }
    </script>
</body>
</html>
