<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adelowo's Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- jsPDF for beautiful PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased pb-24">

    <!-- Top Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-20 flex justify-between items-center shadow-md">
        <h1 class="text-base font-extrabold tracking-wider text-emerald-400">ADELOWO'S LEDGER</h1>
        <div class="flex items-center space-x-3">
            <a href="budget.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg font-medium transition-colors">Budget Setup</a>
            <span id="current-date" class="text-xs text-slate-400 hidden sm:inline"></span>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-5">

        <!-- Financial Health & Quotient Health Dashboard Widget -->
        <section class="bg-gradient-to-br from-slate-900 to-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Weekly Financial Health</h2>
                <span id="health-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide">Calculating...</span>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center pt-1">
                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800/80">
                    <p class="text-[10px] text-slate-400 uppercase">Inflow</p>
                    <p id="health-inflow" class="text-xs font-bold text-emerald-400 mt-1">₦0</p>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800/80">
                    <p class="text-[10px] text-slate-400 uppercase">Outflow</p>
                    <p id="health-outflow" class="text-xs font-bold text-rose-400 mt-1">₦0</p>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800/80">
                    <p class="text-[10px] text-slate-400 uppercase">Net Position</p>
                    <p id="health-net" class="text-xs font-bold text-blue-400 mt-1">₦0</p>
                </div>
            </div>
        </section>

        <!-- Summary Cards -->
        <section class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                <p class="text-[11px] text-slate-400 uppercase tracking-wider">Total Inflow</p>
                <p id="total-income" class="text-lg font-semibold text-emerald-400 mt-1">₦0</p>
            </div>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                <p class="text-[11px] text-slate-400 uppercase tracking-wider">Total Outflow</p>
                <p id="total-expense" class="text-lg font-semibold text-rose-400 mt-1">₦0</p>
            </div>
        </section>

        <!-- Quick Entry Form -->
        <section class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
            <h2 id="form-title" class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Log Transaction</h2>
            <form id="transaction-form" class="space-y-3">
                <input type="hidden" id="edit-id" value="">
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[11px] text-slate-400">Executor</label>
                        <select id="executor" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="Adel">Adel</option>
                            <option value="Chinyere">Chinyere</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[11px] text-slate-400">Type</label>
                        <select id="type" onchange="toggleFormMode()" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-[11px] text-slate-400">Amount (₦)</label>
                    <input type="number" id="amount" step="1" min="1" required placeholder="1" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>

                <!-- EXPENSE FIELDS CONTAINER -->
                <div id="expense-fields" class="space-y-3">
                    <div>
                        <label class="text-[11px] text-slate-400">Category Channel</label>
                        <select id="tracking-type" onchange="updateExpenseSubCategories()" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="Fixed Personal">Fixed Personal Expenses</option>
                            <option value="Fixed Shop">Fixed Shop Based Expenses</option>
                            <option value="Random">Random Expenses</option>
                            <option value="Savings">Savings</option>
                        </select>
                    </div>

                    <!-- Sub-category wrapper -->
                    <div id="sub-category-wrapper">
                        <label class="text-[11px] text-slate-400">Sub-Category</label>
                        <select id="sub-category" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="Food">Food</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Utility">Utility</option>
                            <option value="Fueling and Transportation">Fueling and Transportation</option>
                        </select>
                    </div>

                    <!-- Shop wrapper (Hidden by default) -->
                    <div id="shop-wrapper" class="hidden space-y-3">
                        <div>
                            <label class="text-[11px] text-slate-400">Select Shop</label>
                            <select id="shop" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                                <option value="Elewi Odo">Elewi Odo</option>
                                <option value="10/10">10/10</option>
                                <option value="Idi Ape">Idi Ape</option>
                                <option value="Gbaremu">Gbaremu</option>
                                <option value="Oluyole">Oluyole</option>
                                <option value="Gbagi Shop">Gbagi Shop</option>
                                <option value="Bodija Ojú Irin">Bodija Ojú Irin</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-400">Shop Expense Type</label>
                            <select id="shop-expense-type" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                                <option value="Paper">Paper</option>
                                <option value="Data">Data</option>
                                <option value="Salary">Salary</option>
                                <option value="Utility">Utility</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-[11px] text-slate-400">Description / Note</label>
                        <input type="text" id="note" placeholder="Provide description details..." class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <!-- INCOME FIELDS CONTAINER (Hidden by default) -->
                <div id="income-fields" class="hidden space-y-3">
                    <div>
                        <label class="text-[11px] text-slate-400">Income Category</label>
                        <select id="income-category" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="Service">Service</option>
                            <option value="Sales">Sales</option>
                            <option value="Commission">Commission</option>
                            <option value="Gift">Gift</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[11px] text-slate-400">Description Details <span class="text-rose-400">*</span></label>
                        <input type="text" id="income-description" placeholder="Enter specific details of this income..." class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div class="flex space-x-2 pt-1">
                    <button type="submit" id="submit-btn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition-colors">
                        Save Transaction
                    </button>
                    <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-lg text-sm transition-colors">
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <!-- Reports & PDF Statement Section -->
        <section class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Statement & PDF Report</h2>
                <select id="report-filter" onchange="renderReports()" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-300 focus:outline-none">
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly" selected>This Month</option>
                    <option value="annual">Annual</option>
                    <option value="all">All Time</option>
                </select>
            </div>
            <div id="report-output" class="text-xs text-slate-400 bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-1.5">
                <!-- Metrics injected dynamically -->
            </div>
            <button onclick="generatePDFStatement()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg text-xs transition-colors flex items-center justify-center space-x-1">
                <span>Download Colorful PDF Statement</span>
            </button>
        </section>

        <!-- Recent Logs -->
        <section class="space-y-2.5">
            <h2 class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Recent History</h2>
            <div id="transaction-list" class="space-y-2">
                <p class="text-xs text-slate-500 text-center py-4">Loading transactions...</p>
            </div>
        </section>

    </main>

    <script>
        // REPLACE WITH YOUR SUPABASE CREDENTIALS
        const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allTransactions = [];

        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

        async function fetchTransactions() {
            const { data, error } = await _supabase
                .from('transactions')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching data:', error);
                return;
            }

            allTransactions = data || [];
            updateUI();
        }

        function toggleFormMode() {
            const type = document.getElementById('type').value;
            const expenseFields = document.getElementById('expense-fields');
            const incomeFields = document.getElementById('income-fields');

            if (type === 'income') {
                expenseFields.classList.add('hidden');
                incomeFields.classList.remove('hidden');
                document.getElementById('income-description').setAttribute('required', 'true');
            } else {
                incomeFields.classList.add('hidden');
                expenseFields.classList.remove('hidden');
                document.getElementById('income-description').removeAttribute('required');
            }
        }

        function updateExpenseSubCategories() {
            const trackingType = document.getElementById('tracking-type').value;
            const subCategoryWrapper = document.getElementById('sub-category-wrapper');
            const shopWrapper = document.getElementById('shop-wrapper');
            const subCategorySelect = document.getElementById('sub-category');

            if (trackingType === 'Fixed Personal') {
                subCategoryWrapper.classList.remove('hidden');
                shopWrapper.classList.add('hidden');
                subCategorySelect.innerHTML = `
                    <option value="Food">Food</option>
                    <option value="Groceries">Groceries</option>
                    <option value="Utility">Utility</option>
                    <option value="Fueling and Transportation">Fueling and Transportation</option>
                `;
            } else if (trackingType === 'Fixed Shop') {
                subCategoryWrapper.classList.add('hidden');
                shopWrapper.classList.remove('hidden');
            } else if (trackingType === 'Random' || trackingType === 'Savings') {
                subCategoryWrapper.classList.remove('hidden');
                shopWrapper.classList.add('hidden');
                subCategorySelect.innerHTML = `<option value="${trackingType}">${trackingType} Expense</option>`;
            }
        }

        const form = document.getElementById('transaction-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const editId = document.getElementById('edit-id').value;
            btn.innerText = 'Saving...';
            btn.disabled = true;

            const type = document.getElementById('type').value;
            let txData = {
                executor: document.getElementById('executor').value,
                type: type,
                amount: parseFloat(document.getElementById('amount').value),
            };

            if (type === 'income') {
                txData.tracking_type = 'Income';
                txData.category = document.getElementById('income-category').value;
                txData.income_category = document.getElementById('income-category').value;
                txData.description = document.getElementById('income-description').value;
                txData.shop = null;
                txData.sub_category = null;
            } else {
                const trackingType = document.getElementById('tracking-type').value;
                txData.tracking_type = trackingType;
                txData.category = trackingType;
                txData.income_category = null;
                
                if (trackingType === 'Fixed Shop') {
                    txData.shop = document.getElementById('shop').value;
                    txData.sub_category = document.getElementById('shop-expense-type').value;
                    txData.description = document.getElementById('note').value || `${txData.shop} - ${txData.sub_category}`;
                } else {
                    txData.shop = null;
                    txData.sub_category = document.getElementById('sub-category').value;
                    txData.description = document.getElementById('note').value || 'Unspecified';
                }
            }

            let error;
            if (editId) {
                const res = await _supabase.from('transactions').update(txData).eq('id', editId);
                error = res.error;
            } else {
                const res = await _supabase.from('transactions').insert([txData]);
                error = res.error;
            }

            if (error) {
                alert('Error saving transaction: ' + error.message);
            } else {
                resetForm();
                await fetchTransactions();
            }

            btn.innerText = 'Save Transaction';
            btn.disabled = false;
        });

        function resetForm() {
            form.reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').innerText = 'Log Transaction';
            document.getElementById('submit-btn').innerText = 'Save Transaction';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            toggleFormMode();
            updateExpenseSubCategories();
        }

        function editTransaction(id) {
            const tx = allTransactions.find(t => t.id == id);
            if (!tx) return;

            document.getElementById('edit-id').value = tx.id;
            document.getElementById('executor').value = tx.executor || 'Adel';
            document.getElementById('type').value = tx.type;
            document.getElementById('amount').value = tx.amount;
            
            toggleFormMode();

            if (tx.type === 'income') {
                document.getElementById('income-category').value = tx.income_category || tx.category || 'Service';
                document.getElementById('income-description').value = tx.description || '';
            } else {
                document.getElementById('tracking-type').value = tx.tracking_type || 'Fixed Personal';
                updateExpenseSubCategories();
                if (tx.tracking_type === 'Fixed Shop') {
                    document.getElementById('shop').value = tx.shop || 'Elewi Odo';
                    document.getElementById('shop-expense-type').value = tx.sub_category || 'Paper';
                } else if (tx.sub_category) {
                    const subSelect = document.getElementById('sub-category');
                    if ([...subSelect.options].some(o => o.value === tx.sub_category)) {
                        subSelect.value = tx.sub_category;
                    }
                }
                document.getElementById('note').value = tx.description || '';
            }

            document.getElementById('form-title').innerText = 'Edit Transaction #' + tx.id;
            document.getElementById('submit-btn').innerText = 'Update Transaction';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteTransaction(id) {
            if (!confirm('Are you sure you want to delete this transaction record?')) return;
            const { error } = await _supabase.from('transactions').delete().eq('id', id);
            if (error) {
                alert('Error deleting record: ' + error.message);
            } else {
                await fetchTransactions();
            }
        }

        function formatCurrency(amount) {
            return '₦' + Number(amount).toLocaleString('en-NG', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        function getFilteredTransactions() {
            const mode = document.getElementById('report-filter').value;
            const now = new Date();
            
            return allTransactions.filter(t => {
                const tDate = new Date(t.created_at);
                if (mode === 'daily') {
                    return tDate.toDateString() === now.toDateString();
                } else if (mode === 'weekly') {
                    const oneWeekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                    return tDate >= oneWeekAgo;
                } else if (mode === 'monthly') {
                    return tDate.getMonth() === now.getMonth() && tDate.getFullYear() === now.getFullYear();
                } else if (mode === 'annual') {
                    return tDate.getFullYear() === now.getFullYear();
                }
                return true;
            });
        }

        function updateUI() {
            // Overall global totals
            let totalInc = allTransactions.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount), 0);
            let totalExp = allTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0);

            document.getElementById('total-income').innerText = formatCurrency(totalInc);
            document.getElementById('total-expense').innerText = formatCurrency(totalExp);

            // Weekly Health Quotient calculation
            const now = new Date();
            const oneWeekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            const weeklyTx = allTransactions.filter(t => new Date(t.created_at) >= oneWeekAgo);
            let wInc = weeklyTx.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
            let wExp = weeklyTx.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
            let wNet = wInc - wExp;

            document.getElementById('health-inflow').innerText = formatCurrency(wInc);
            document.getElementById('health-outflow').innerText = formatCurrency(wExp);
            const netEl = document.getElementById('health-net');
            netEl.innerText = formatCurrency(wNet);
            netEl.className = `text-xs font-bold mt-1 ${wNet >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

            const badge = document.getElementById('health-badge');
            if (wNet > 0) {
                badge.innerText = 'Sufficit (Surplus)';
                badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
            } else if (wNet < 0) {
                badge.innerText = 'Deficit';
                badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide bg-rose-500/20 text-rose-400 border border-rose-500/30';
            } else {
                badge.innerText = 'Balanced';
                badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide bg-blue-500/20 text-blue-400 border border-blue-500/30';
            }

            // Render list
            const listEl = document.getElementById('transaction-list');
            listEl.innerHTML = '';

            if (allTransactions.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No transactions recorded yet.</p>`;
            } else {
                allTransactions.slice(0, 15).forEach(t => {
                    const item = document.createElement('div');
                    item.className = "bg-slate-900 border border-slate-800 p-3 rounded-lg flex justify-between items-center text-xs";
                    const tDate = new Date(t.created_at);
                    const details = t.type === 'income' ? (t.description || t.income_category) : (t.shop ? `${t.shop} (${t.sub_category})` : (t.description || t.sub_category));
                    
                    item.innerHTML = `
                        <div class="space-y-0.5 pr-2">
                            <p class="font-medium text-slate-200">${details} <span class="text-[9px] text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded ml-1">${t.executor || 'Adel'}</span></p>
                            <p class="text-[10px] text-slate-400">${t.tracking_type || t.type} • ${tDate.toLocaleDateString()} ${tDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold whitespace-nowrap ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">
                                ${t.type === 'income' ? '+' : '-'}${formatCurrency(t.amount)}
                            </span>
                            <div class="flex flex-col space-y-1">
                                <button onclick="editTransaction(${t.id})" class="text-[10px] text-blue-400 hover:underline">Edit</button>
                                <button onclick="deleteTransaction(${t.id})" class="text-[10px] text-rose-400 hover:underline">Del</button>
                            </div>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            }
            renderReports();
        }

        function renderReports() {
            const filtered = getFilteredTransactions();
            let inc = filtered.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
            let exp = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
            let net = inc - exp;

            document.getElementById('report-output').innerHTML = `
                <div class="flex justify-between"><span>Period Inflow:</span> <span class="text-emerald-400 font-medium">${formatCurrency(inc)}</span></div>
                <div class="flex justify-between"><span>Period Outflow:</span> <span class="text-rose-400 font-medium">${formatCurrency(exp)}</span></div>
                <div class="flex justify-between border-t border-slate-800 pt-1.5 mt-1 font-bold"><span>Net Balance:</span> <span class="${net >= 0 ? 'text-blue-400' : 'text-amber-400'}">${formatCurrency(net)}</span></div>
                <div class="text-[10px] text-slate-500 pt-1">Total Records in View: ${filtered.length}</div>
            `;
        }

        // COLORFUL PDF STATEMENT GENERATOR
        function generatePDFStatement() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const filtered = getFilteredTransactions();
            const filterMode = document.getElementById('report-filter').value.toUpperCase();

            // Colors
            const primaryColor = [15, 23, 42]; // Slate 900
            const accentColor = [16, 185, 129]; // Emerald
            const textDark = [30, 41, 59];
            const grayLight = [241, 245, 249];

            // Header Banner Background
            doc.setFillColor(15, 23, 42);
            doc.rect(0, 0, 210, 40, 'F');

            // Header Title
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(18);
            doc.setFont('helvetica', 'bold');
            doc.text("ADELOWO'S LEDGER", 14, 20);

            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(16, 185, 129);
            doc.text(`FINANCIAL STATEMENT REPORT (${filterMode})`, 14, 28);

            doc.setTextColor(148, 163, 184);
            doc.text(`Generated: ${new Date().toLocaleString()}`, 140, 28);

            // Summary Totals Calculation
            let totalInc = filtered.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
            let totalExp = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
            let netBalance = totalInc - totalExp;

            // Summary Cards Box
            doc.setFillColor(241, 245, 249);
            doc.roundedRect(14, 48, 182, 22, 3, 3, 'F');

            doc.setFontSize(9);
            doc.setTextColor(...textDark);
            doc.text("TOTAL INFLOW", 20, 56);
            doc.text("TOTAL OUTFLOW", 85, 56);
            doc.text("NET BALANCE", 150, 56);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.setTextColor(16, 185, 129);
            doc.text(formatCurrency(totalInc), 20, 64);
            doc.setTextColor(225, 29, 72);
            doc.text(formatCurrency(totalExp), 85, 64);
            doc.setTextColor(37, 99, 235);
            doc.text(formatCurrency(netBalance), 150, 64);

            // Table Headers
            let startY = 80;
            doc.setFillColor(15, 23, 42);
            doc.rect(14, startY, 182, 8, 'F');
            
            doc.setFontSize(8);
            doc.setTextColor(255, 255, 255);
            doc.text("Date", 18, startY + 5.5);
            doc.text("Executor", 45, startY + 5.5);
            doc.text("Type / Channel", 75, startY + 5.5);
            doc.text("Description / Details", 115, startY + 5.5);
            doc.text("Amount (₦)", 170, startY + 5.5);

            // Table Rows
            startY += 8;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);

            if (filtered.length === 0) {
                doc.setTextColor(100, 100, 100);
                doc.text("No transactions found for this period.", 14, startY + 10);
            } else {
                filtered.forEach((t, index) => {
                    if (startY > 270) {
                        doc.addPage();
                        startY = 20;
                    }

                    if (index % 2 === 0) {
                        doc.setFillColor(248, 250, 252);
                        doc.rect(14, startY, 182, 7, 'F');
                    }

                    const tDate = new Date(t.created_at).toLocaleDateString();
                    const details = t.type === 'income' ? (t.description || t.income_category) : (t.shop ? `${t.shop} - ${t.sub_category}` : (t.description || t.sub_category));

                    doc.setTextColor(...textDark);
                    doc.text(tDate, 18, startY + 4.5);
                    doc.text(t.executor || 'Adel', 45, startY + 4.5);
                    doc.text(t.tracking_type || t.type, 75, startY + 4.5);
                    doc.text(details.substring(0, 32), 115, startY + 4.5);

                    if (t.type === 'income') {
                        doc.setTextColor(16, 185, 129);
                        doc.text(`+${Number(t.amount).toLocaleString()}`, 170, startY + 4.5);
                    } else {
                        doc.setTextColor(225, 29, 72);
                        doc.text(`-${Number(t.amount).toLocaleString()}`, 170, startY + 4.5);
                    }

                    startY += 7;
                });
            }

            // Footer
            doc.setFontSize(8);
            doc.setTextColor(150, 150, 150);
            doc.text("Adelowo's Financial Management System — Powered by Supabase", 14, 290);

            doc.save(`Adelowo_Ledger_Statement_${filterMode.toLowerCase()}.pdf`);
        }

        // Initialize fetch on load
        fetchTransactions();
    </script>
</body>
</html>
