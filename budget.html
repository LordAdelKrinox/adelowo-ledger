<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Setup - Adelowo's Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased pb-24 selection:bg-emerald-500 selection:text-white">

    <!-- Header -->
    <header class="bg-zinc-900/70 backdrop-blur-md border-b border-zinc-800/80 p-4 sticky top-0 z-10 flex justify-between items-center shadow-lg">
        <h1 class="text-base font-extrabold tracking-wider text-emerald-400">WEEKLY BUDGET SETUP</h1>
        <a href="index.html" class="bg-zinc-800/80 hover:bg-zinc-700 text-emerald-300 text-xs px-3 py-1.5 rounded-xl border border-zinc-700 font-medium transition-all shadow-sm">Back to Ledger</a>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-5">

        <!-- Enterprise Aggregate Summary Banner -->
        <section class="bg-zinc-900/40 backdrop-blur-xl p-4 rounded-3xl border border-zinc-700/50 shadow-2xl space-y-3 relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Enterprise Master Summary</h2>
                <button onclick="openHealthModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold px-3 py-1.5 rounded-xl shadow-md shadow-emerald-900/30 transition-all">
                    View Budget Health
                </button>
            </div>
            <div class="grid grid-cols-2 gap-2 text-center pt-1">
                <div class="bg-zinc-800/50 backdrop-blur-md p-2.5 rounded-2xl border border-zinc-700/60 shadow-inner">
                    <p class="text-[10px] text-zinc-400 uppercase font-semibold">Total Target Revenue</p>
                    <p id="master-total-revenue" class="text-xs font-bold text-emerald-400 mt-1">₦0</p>
                </div>
                <div class="bg-zinc-800/50 backdrop-blur-md p-2.5 rounded-2xl border border-zinc-700/60 shadow-inner">
                    <p class="text-[10px] text-zinc-400 uppercase font-semibold">Total Allocations</p>
                    <p id="master-total-allocations" class="text-xs font-bold text-rose-400 mt-1">₦0</p>
                </div>
            </div>
            <div class="grid grid-cols-4 gap-1 text-center pt-1 text-[10px]">
                <div class="bg-zinc-800/40 backdrop-blur-md p-1.5 rounded-xl border border-zinc-700/50"><span class="text-zinc-400 block font-medium">Paper</span><span id="master-paper" class="font-bold text-zinc-200">₦0</span></div>
                <div class="bg-zinc-800/40 backdrop-blur-md p-1.5 rounded-xl border border-zinc-700/50"><span class="text-zinc-400 block font-medium">Data</span><span id="master-data" class="font-bold text-zinc-200">₦0</span></div>
                <div class="bg-zinc-800/40 backdrop-blur-md p-1.5 rounded-xl border border-zinc-700/50"><span class="text-zinc-400 block font-medium">Salary</span><span id="master-salary" class="font-bold text-zinc-200">₦0</span></div>
                <div class="bg-zinc-800/40 backdrop-blur-md p-1.5 rounded-xl border border-zinc-700/50"><span class="text-zinc-400 block font-medium">Utility</span><span id="master-utility" class="font-bold text-zinc-200">₦0</span></div>
            </div>
        </section>

        <!-- Select Shop to Configure -->
        <section class="bg-zinc-900/40 backdrop-blur-xl p-4 rounded-3xl border border-zinc-700/50 shadow-xl space-y-3">
            <h2 class="text-xs font-bold text-zinc-300 uppercase tracking-wider">Select Shop Location</h2>
            <select id="budget-shop-select" class="w-full bg-zinc-800/70 border border-zinc-700/80 rounded-2xl p-3 text-sm text-zinc-100 focus:outline-none focus:border-emerald-500 shadow-inner transition-all">
                <option value="Elewi Odo" class="bg-zinc-900 text-zinc-100">Elewi Odo</option>
                <option value="10/10" class="bg-zinc-900 text-zinc-100">10/10</option>
                <option value="Idi Ape" class="bg-zinc-900 text-zinc-100">Idi Ape</option>
                <option value="Gbaremu" class="bg-zinc-900 text-zinc-100">Gbaremu</option>
                <option value="Oluyole" class="bg-zinc-900 text-zinc-100">Oluyole</option>
                <option value="Gbagi Shop" class="bg-zinc-900 text-zinc-100">Gbagi Shop</option>
                <option value="Bodija Oju Irin" class="bg-zinc-900 text-zinc-100">Bodija Oju Irin</option>
            </select>
        </section>

        <!-- Expected Revenue Section -->
        <section class="bg-zinc-900/40 backdrop-blur-xl p-4 rounded-3xl border border-zinc-700/50 shadow-xl space-y-3">
            <h2 class="text-xs font-bold text-zinc-300 uppercase tracking-wider">Expected Weekly Target for Shop</h2>
            <div>
                <label class="text-[11px] text-zinc-400 font-medium">Target Revenue (₦)</label>
                <input type="number" id="expected-revenue" min="0" placeholder="0" class="w-full mt-1 bg-zinc-800/70 border border-zinc-700/80 rounded-2xl p-3 text-sm text-zinc-100 focus:outline-none focus:border-emerald-500 placeholder-zinc-500 shadow-inner transition-all">
            </div>
        </section>

        <!-- Shop Expense Allocations -->
        <section class="bg-zinc-900/40 backdrop-blur-xl p-4 rounded-3xl border border-zinc-700/50 shadow-xl space-y-3">
            <h2 class="text-xs font-bold text-zinc-300 uppercase tracking-wider">Shop Specific Weekly Expense Allocations (₦)</h2>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] text-zinc-400 font-medium">Paper (₦)</label>
                    <input type="number" id="shop-paper" min="0" placeholder="0" class="w-full mt-1 bg-zinc-800/70 border border-zinc-700/80 rounded-2xl p-2.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500 shadow-inner transition-all">
                </div>
                <div>
                    <label class="text-[10px] text-zinc-400 font-medium">Data (₦)</label>
                    <input type="number" id="shop-data" min="0" placeholder="0" class="w-full mt-1 bg-zinc-800/70 border border-zinc-700/80 rounded-2xl p-2.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500 shadow-inner transition-all">
                </div>
                <div>
                    <label class="text-[10px] text-zinc-400 font-medium">Salary (₦)</label>
                    <input type="number" id="shop-salary" min="0" placeholder="0" class="w-full mt-1 bg-zinc-800/70 border border-zinc-700/80 rounded-2xl p-2.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500 shadow-inner transition-all">
                </div>
                <div>
                    <label class="text-[10px] text-zinc-400 font-medium">Utility (₦)</label>
                    <input type="number" id="shop-utility" min="0" placeholder="0" class="w-full mt-1 bg-zinc-800/70 border border-zinc-700/80 rounded-2xl p-2.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500 shadow-inner transition-all">
                </div>
            </div>
        </section>

        <button id="save-budget-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-2xl text-sm transition-all shadow-lg shadow-emerald-900/40 active:scale-[0.98]">
            Save Budget for Selected Shop
        </button>

    </main>

    <!-- Budget Health Analysis Modal -->
    <div id="health-modal" class="fixed inset-0 bg-zinc-950/80 backdrop-blur-md flex items-center justify-center p-4 hidden z-50 transition-all">
        <div id="health-modal-container" class="bg-zinc-900/80 backdrop-blur-2xl border border-zinc-700/80 p-5 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h3 class="text-sm font-bold text-emerald-400 uppercase tracking-wide">Enterprise Budget Health</h3>
                <button onclick="closeHealthModal()" class="text-zinc-400 hover:text-zinc-100 font-bold text-sm bg-zinc-800/50 p-1.5 rounded-xl">✕</button>
            </div>
            <div id="modal-health-content" class="text-xs space-y-3 text-zinc-300 font-medium">
                <!-- Injected dynamically -->
            </div>
            <button onclick="closeHealthModal()" class="w-full bg-zinc-800/80 hover:bg-zinc-700 text-zinc-200 py-3 rounded-2xl text-xs font-semibold border border-zinc-700/50 shadow-md">Close Assessment</button>
        </div>
    </div>

    <script>
        const shopSelect = document.getElementById('budget-shop-select');
        const revenueInput = document.getElementById('expected-revenue');
        const paperInput = document.getElementById('shop-paper');
        const dataInput = document.getElementById('shop-data');
        const salaryInput = document.getElementById('shop-salary');
        const utilityInput = document.getElementById('shop-utility');
        const healthModal = document.getElementById('health-modal');

        const allShops = ["Elewi Odo", "10/10", "Idi Ape", "Gbaremu", "Oluyole", "Gbagi Shop", "Bodija Oju Irin"];

        function loadShopBudget(shopName) {
            const allBudgets = JSON.parse(localStorage.getItem('adelowo_shop_budgets')) || {};
            const shopData = allBudgets[shopName] || { revenue: '', paper: '', data: '', salary: '', utility: '' };
            
            revenueInput.value = shopData.revenue;
            paperInput.value = shopData.paper;
            dataInput.value = shopData.data;
            salaryInput.value = shopData.salary;
            utilityInput.value = shopData.utility;
        }

        function updateMasterSummary() {
            const allBudgets = JSON.parse(localStorage.getItem('adelowo_shop_budgets')) || {};
            let totalRev = 0, totalPaper = 0, totalData = 0, totalSalary = 0, totalUtility = 0;

            allShops.forEach(shop => {
                const b = allBudgets[shop];
                if (b) {
                    totalRev += Math.max(0, Number(b.revenue) || 0);
                    totalPaper += Math.max(0, Number(b.paper) || 0);
                    totalData += Math.max(0, Number(b.data) || 0);
                    totalSalary += Math.max(0, Number(b.salary) || 0);
                    totalUtility += Math.max(0, Number(b.utility) || 0);
                }
            });

            const totalAlloc = totalPaper + totalData + totalSalary + totalUtility;

            document.getElementById('master-total-revenue').innerText = '₦' + totalRev.toLocaleString();
            document.getElementById('master-total-allocations').innerText = '₦' + totalAlloc.toLocaleString();
            document.getElementById('master-paper').innerText = '₦' + totalPaper.toLocaleString();
            document.getElementById('master-data').innerText = '₦' + totalData.toLocaleString();
            document.getElementById('master-salary').innerText = '₦' + totalSalary.toLocaleString();
            document.getElementById('master-utility').innerText = '₦' + totalUtility.toLocaleString();
        }

        loadShopBudget(shopSelect.value);
        updateMasterSummary();

        shopSelect.addEventListener('change', (e) => loadShopBudget(e.target.value));

        document.getElementById('save-budget-btn').addEventListener('click', () => {
            const currentShop = shopSelect.value;
            const allBudgets = JSON.parse(localStorage.getItem('adelowo_shop_budgets')) || {};
            
            allBudgets[currentShop] = {
                revenue: revenueInput.value,
                paper: paperInput.value,
                data: dataInput.value,
                salary: salaryInput.value,
                utility: utilityInput.value
            };

            localStorage.setItem('adelowo_shop_budgets', JSON.stringify(allBudgets));
            updateMasterSummary();
            alert(`Budget settings for ${currentShop} saved successfully!`);
        });

        function openHealthModal() {
            const allBudgets = JSON.parse(localStorage.getItem('adelowo_shop_budgets')) || {};
            let totalRev = 0, totalAlloc = 0;

            allShops.forEach(shop => {
                const b = allBudgets[shop];
                if (b) {
                    totalRev += Math.max(0, Number(b.revenue) || 0);
                    totalAlloc += Math.max(0, Number(b.paper) || 0) + Math.max(0, Number(b.data) || 0) + Math.max(0, Number(b.salary) || 0) + Math.max(0, Number(b.utility) || 0);
                }
            });

            const netMargin = totalRev - totalAlloc;
            const ratio = totalRev > 0 ? ((totalAlloc / totalRev) * 100).toFixed(1) : 0;

            let healthStatus = 'Optimal Growth';
            let statusColor = 'text-emerald-400 bg-emerald-950/60 border border-emerald-800';
            if (ratio > 70) {
                healthStatus = 'High Expense Ratio Alert';
                statusColor = 'text-rose-400 bg-rose-950/60 border border-rose-800';
            } else if (ratio > 50) {
                healthStatus = 'Moderate / Stable';
                statusColor = 'text-amber-400 bg-amber-950/60 border border-amber-800';
            }

            document.getElementById('modal-health-content').innerHTML = `
                <div class="flex justify-between text-zinc-300"><span>Combined Expected Revenue:</span> <span class="font-semibold text-emerald-400">₦${totalRev.toLocaleString()}</span></div>
                <div class="flex justify-between text-zinc-300"><span>Combined Total Allocations:</span> <span class="font-semibold text-rose-400">₦${totalAlloc.toLocaleString()}</span></div>
                <div class="flex justify-between text-zinc-300"><span>Projected Net Margin:</span> <span class="font-semibold text-blue-400">₦${netMargin.toLocaleString()}</span></div>
                <div class="flex justify-between text-zinc-300"><span>Expense-to-Revenue Ratio:</span> <span class="font-semibold text-zinc-100">${ratio}%</span></div>
                <div class="border-t border-zinc-800 pt-2 flex justify-between items-center">
                    <span class="text-zinc-300">Health Rating:</span> 
                    <span class="font-bold uppercase px-2 py-0.5 rounded-lg ${statusColor}">${healthStatus}</span>
                </div>
            `;
            healthModal.classList.remove('hidden');
        }

        function closeHealthModal() {
            healthModal.classList.add('hidden');
        }

        healthModal.addEventListener('click', (e) => {
            if (e.target === healthModal) {
                closeHealthModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !healthModal.classList.contains('hidden')) {
                closeHealthModal();
            }
        });
    </script>
</body>
</html>
